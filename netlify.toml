[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Netlify's current Next.js support uses the OpenNext adapter automatically.
# App Router route handlers are deployed as Netlify Functions without extra config.
# Netlify Database manages the production Postgres/Neon connection via
# NETLIFY_DB_URL. Keep that environment variable managed in Netlify rather than
# hardcoding production credentials in this repo.
