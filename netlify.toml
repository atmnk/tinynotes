[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Netlify's current Next.js support uses the OpenNext adapter automatically.
# App Router route handlers are deployed as Netlify Functions without extra config.
# Set DATABASE_URL to the Neon connection string in Netlify's environment
# variables UI (Settings > Environment variables). Do not hardcode credentials here.
