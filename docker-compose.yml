services:
  postgres:
    image: postgres:16-alpine
    container_name: notes-everywhere-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: notes_everywhere
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notes_everywhere"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
